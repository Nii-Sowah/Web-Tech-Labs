name: Auto Update README Elements

on:
  push:
    branches:
      - main  # Change to master if your default branch is master

permissions:
  contents: write

jobs:
  refresh-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to accurately calculate total commit count

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-python-version: '3.10'

      - name: Run README Generator Script
        run: python .github/update_readme.py

      - name: Commit and Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          git add README.md
          git commit -m "docs: automated update of TOC, stats, and timestamp [skip ci]" || echo "No changes to commit"
          git push
